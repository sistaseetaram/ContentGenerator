            - text: Archi-Tech Network is an online educational platform promoting the discussion, knowledge sharing and entrepreneurship at the intersection of Architecture and Technology. We connect the gap between university and practice by getting world class tutors working in real world practice to teach. We share knowledge through our 4 main mediums, our Podcast, Tours, Events and Online courses. Founded by Oliver Thomas after working for over a decade in practice for firms like Aedas, Front Inc and Bjarke Ingels Group specializing in design, technology and fabrication. Oliver curatues the courses, events, podcast and tours to give students top tier real world knowledge from the unique practice of working in practice. Join the Archi-Tech Network by subscribing to our channel and other social media platforms. ARCHITECH NETWORK |
