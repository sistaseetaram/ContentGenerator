        - generic [ref=f514e451]:
          - heading "vidIQ MCP Common Questions" [level=2] [ref=f514e452]
          - generic [ref=f514e453]:
            - generic [ref=f514e454]:
              - button "What is MCP and how does it work with vidIQ?" [expanded] [ref=f514e455]
              - region "What is MCP and how does it work with vidIQ?" [ref=f514e459]:
                - generic [ref=f514e460]: MCP (Model Context Protocol) is an open standard that lets AI tools connect to external data sources. vidIQ's MCP server gives Claude, Cursor, ChatGPT, Codex, and others direct access to your YouTube analytics - so you can ask questions in plain English and get real, data-backed answers.
            - generic [ref=f514e462]:
              - button "Is vidIQ listed in Claude's Connector Directory?" [ref=f514e463]
              - generic: Yes. vidIQ is officially listed in Claude's Connector Directory. Open the vidIQ listing, click Connect, and authorize your account - no custom connector or MCP server URL is required.
            - generic [ref=f514e467]:
              - button "What plan do I need to use the MCP server?" [ref=f514e468]
              - generic: The vidIQ MCP server is available on every plan, including Free. MCP calls draw from the same shared credit pool as the rest of your vidIQ plan, so usage stays consolidated in one place.
            - generic [ref=f514e472]:
              - button "How do I authenticate - API key or OAuth?" [ref=f514e473]
              - generic: Both. We recommend an API key (Bearer token) - it works with every MCP client and takes about 10 seconds to set up. Claude and ChatGPT can also use OAuth so you sign in with your vidIQ account in the browser. Generate or rotate keys any time at app.vidiq.com/account/settings/mcp - keys are scoped to MCP access only and revocable in one click.
            - generic [ref=f514e477]:
              - button "Does using MCP count against my YouTube API quota?" [ref=f514e478]
              - generic: No. vidIQ's MCP server uses our own data infrastructure, not the YouTube Data API. Your YouTube API quota is completely unaffected.
            - generic [ref=f514e482]:
              - button "Can the AI tool modify my YouTube channel through MCP?" [ref=f514e483]
              - generic: No. vidIQ's MCP server is read-only for your YouTube channel. AI tools can query and surface insights from YouTube data, but they cannot post videos, change channel settings, or modify anything on your account. The only thing they can update is your vidIQ competitor watchlist.
            - generic [ref=f514e487]:
              - button "Which AI tools are supported?" [ref=f514e488]
              - generic: "Any tool that speaks the MCP protocol: Claude, Claude Code, ChatGPT, Cursor, Codex, OpenClaw, and others. If your tool supports MCP, vidIQ works with it."
            - generic [ref=f514e492]:
              - button "Is my YouTube data secure?" [ref=f514e493]
              - generic: Yes. API keys are scoped to MCP access only, are revocable at any time, and are never shared with third-party AI providers. vidIQ only sends data in response to your explicit queries.
        - generic [ref=f514e498]:
