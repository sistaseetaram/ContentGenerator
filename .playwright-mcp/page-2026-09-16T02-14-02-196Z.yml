              - heading "What are the key topics in the report?" [level=3] [ref=f167e159]
              - paragraph [ref=f167e160]: "Guided by the RIBA Expert Advisory Group on AI, data and generative design, the report brings together a series of articles exploring the relationship between AI and architecture, and how it can be embedded in day-to-day practice. Following an introduction from RIBA President, Chris Williamson, the report explores:"
              - list [ref=f167e161]:
                - listitem [ref=f167e162]: Detailed findings of the RIBA AI research
                - listitem [ref=f167e163]: The three key concepts for understanding AI and the design process
                - listitem [ref=f167e164]: AI in procurement decision-making, and what this means for architects
                - listitem [ref=f167e165]: Using AI to create of better human habitats
                - listitem [ref=f167e166]: What AI means for ethics, inclusion and the environment
                - listitem [ref=f167e167]: A ‘people first’ approach to AI in architecture
                - listitem [ref=f167e168]: AI and business transformation
                - listitem [ref=f167e169]: How ‘foresight’ can help architects navigate the AI future
                - listitem [ref=f167e170]: AI and standards
              - paragraph [ref=f167e171]: RIBA will continue to monitor developments in AI, providing evidence-based insight, guidance and a forum for knowledge exchange. Our sincere thanks to the report contributors and to all who completed our annual survey.
