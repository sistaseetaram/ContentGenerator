              - heading "RIBA Artificial Intelligence Report 2026" [level=1] [ref=f167e116]
            - generic [ref=f167e117]: Read the findings of RIBA's largest-ever survey about how artificial intelligence (AI) is affecting architectural practice. The 2026 report provides up-to-date data about AI and the profession, complemented by expert analysis and guidance.
            - link "Download the 2026 report" [ref=f167e118] [cursor=pointer]:
