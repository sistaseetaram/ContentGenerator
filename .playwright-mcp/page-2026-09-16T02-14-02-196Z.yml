              - heading "How are architects using AI?" [level=2] [ref=f167e138]
              - paragraph [ref=f167e139]: The RIBA 2026 AI survey indicates that nearly three-quarters of practices (74%) now use AI in at least some of their projects, continuing the upward trend in adoption.
              - paragraph [ref=f167e140]: AI is being applied across the range of practice activities, from early design stage visualisation to project management, as well as supporting the day-to-day tasks of running a business.
            - generic [ref=f167e146]:
