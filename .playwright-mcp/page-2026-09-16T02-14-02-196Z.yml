            - generic [ref=f167e185]:
              - heading "Are Practices finally seeing the benefits of AI?" [level=3] [ref=f167e186]
              - paragraph [ref=f167e187]: The profession’s view of AI is developing, the third RIBA AI report shows. Many practices are beginning to see measurable benefits of AI, including improved productivity and a return on investment. It is providing efficiencies in design work and practice management alike.
              - paragraph [ref=f167e188]: But the profession is not adopting a naïve techno-optimist stance. Architects are increasingly highlighting the risks associated with AI. There are concerns about the technology’s detrimental effects on the environment, future jobs, intellectual property, and the career path of those starting out in the profession.
              - paragraph [ref=f167e189]: Navigating this fast-changing AI landscape underscores the importance of architecture as a profession. The safe and responsible use of AI to create our built environment requires the creativity, judgement, ethical probity and ongoing learning of architects and aligned professions.
