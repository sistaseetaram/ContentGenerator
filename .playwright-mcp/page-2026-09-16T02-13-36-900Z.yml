                                          - generic [ref=f144e1064]:
                                            - paragraph [ref=f144e1067]: The AI act is not about pestering content producers, but about preserving a shared truth as a basis for public opinion and democratic decision making. Like you said, AI is an order of magnitude better than the tools previously available, so the conditions under which the output of those tools is disseminated should also be protected an order of magnitude better. This is a stopgap law to at least have a legal framework by which the development you describe can be controlled when necessary. Traditional media are subjected to journalistic codes and practices in most democracies that puts some restraints on them from misrepresenting facts and doctoring images to create falsehoods. They are imperfect, but they exist. On social media there are no such governing institutions (the platforms have made sure of that). This law at least provides some measure of protection to the general public.
