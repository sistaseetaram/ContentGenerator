                            - listitem [ref=f144e137]:
                              - alert
                              - article "Comment by thinkagain , When a digital image that has been created by AI is indistinguishable enough from reality to deceive anyone in any situation, the need to undo that seems unarguable. AI digital art pieces by known AI artists are often distinguishable by association, but disconnected from that association, not always. If the artists were to sign their digital AI work as painters do, wouldn't it be easy to manipulate unlike a hard painting? I welcome this new AI act as I am weary of guessing and being deceived enough as well the mistrust it ensues. This all after suffering the damage of years of photoshopped images, so I am sure the AI act will serve us all well and evolve as needed." [ref=f144e138]:
