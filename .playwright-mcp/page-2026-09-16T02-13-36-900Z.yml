                    - time [ref=f140e176]: 10 August 2026
                  - generic [ref=f140e177] [cursor=pointer]:
                    - text: "|"
                    - link "23 comments" [ref=f140e178]:
                      - /url: https://www.dezeen.com/2026/08/10/ai-architectural-renderings-eu-ai-act/#disqus_thread
              - generic [ref=f140e179]:
                - paragraph [ref=f140e180]:
                  - text: Artists and companies publishing realistic
                  - link "AI" [ref=f140e181] [cursor=pointer]:
                    - /url: https://www.dezeen.com/tag/ai/
                  - text: "-generated architectural"
                  - link "renderings" [ref=f140e182] [cursor=pointer]:
                    - /url: https://www.dezeen.com/tag/renderings/
                  - text: in the
                  - link "European Union" [ref=f140e183] [cursor=pointer]:
                    - /url: https://www.dezeen.com/tag/european-union/
                  - text: without labelling risk being fined under provisions in the EU AI Act that came into force last week.
                - paragraph [ref=f140e184]:
                  - text: The
                  - link "EU Artificial Intelligence Act Article 50" [ref=f140e185] [cursor=pointer]:
                    - /url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-50
                  - text: ", which came into force on 2 August, requires creators of realistic-looking images, audio or video to disclose if the content is AI-generated or modified to reduce incidences of harm through deception."
                - paragraph [ref=f140e186]:
                  - text: Many creative works are exempt from the provisions, but realistic AI-generated visualisations of buildings and interiors appear to fall under the act's categorisation of "deepfakes", according to Szymon Sieniewicz, a counsel at law firm
                  - link "Addleshaw Goddard" [ref=f140e187] [cursor=pointer]:
                    - /url: https://www.addleshawgoddard.com/en/
                  - text: .
                - paragraph [ref=f140e188]: "\"If it's realistic scenery with people walking around and it is AI generated, it will need to be labelled as AI generated,\" he told Dezeen."
                - paragraph [ref=f140e189]: Companies using AI to modify product photos, using chatbots on their homepage or publishing AI-generated text on matters of public interest will also face new obligations under the provisions.
                - paragraph [ref=f140e190]:
                  - strong [ref=f140e191]: Realistic renderings "likely" to come under deepfake definition
                - paragraph [ref=f140e192]: The EU AI Act was passed in 2024, but its Article 50 transparency provisions are the first section to come into force that affects all businesses using AI, not just those developing AI systems.
                - paragraph [ref=f140e193]: The subsection expected to have the most impact is Article 50(4), which requires creators of images, audio or video content constituting a deepfake to disclose that the content has been artificially generated or manipulated.
                - paragraph [ref=f140e194]: While architectural visualisations might not be what most people think of as deepfakes – a term most commonly used to refer to synthetic media of real people saying or doing things they've never done – Sieniewicz told Dezeen that they are "likely" to be swept up in the act's definition.
                - paragraph [ref=f140e195]: Under this definition, an image is a deepfake if it resembles existing persons, objects, places, entities or events and would falsely appear to a person to be authentic or truthful.
                - figure "The European Commission's AI Office has created icons that are available for public use" [ref=f140e196]:
                  - link [ref=f140e197]:
                    - /url: https://static.dezeen.com/uploads/2026/08/eu-ai-act-transparency-icons-design_dezeen_1704_col_0.jpg
                    - img "Screeshot of AI generated and AI modified icons created by the EU AI Office in four different variations" [ref=f140e198]
                - paragraph [ref=f140e200]: This includes situations where the depicted subject is fictional but realistic, as in the case of an unbuilt building or a non-existent person.
                - paragraph [ref=f140e201]: Sieniewicz said the video games industry would be facing a similar situation to architects in the case of games with realistic environments resembling cities.
                - paragraph [ref=f140e202]:
                  - text: The act does not dictate how AI content should be labelled beyond that it should be clear and distinguishable and relayed at the latest at the time of the first interaction or exposure. But guidelines in the European Commission's accompanying
                  - link "Code of Practice on Transparency of AI-generated Content" [ref=f140e203] [cursor=pointer]:
                    - /url: https://digital-strategy.ec.europa.eu/en/policies/code-practice-ai-generated-content
                  - text: call for the use of an icon with the text "AI generated" or "AI modified".
                - paragraph [ref=f140e204]: Violation of the act can attract fines of up to €15 million or up to 3 per cent of a company's annual turnover, but Sieniewicz stressed that he does not expect regulators to impose severe fines right away.
                - paragraph [ref=f140e205]:
                  - strong [ref=f140e206]: Product imagery and public-interest text also affected
                - paragraph [ref=f140e207]: Designers and companies showcasing their products through photography will also need to be aware of the new obligations, as any AI-made material alterations to an image will also require labelling.
                - paragraph [ref=f140e208]: For instance, Addleshaw Goddard advises that using AI to make a product appear more attractive, of higher quality or of a different colour will trigger the obligation to disclose AI modification.
                - paragraph [ref=f140e209]: Mere retouching with AI – such as cropping, colour correction, compression or replacing a background – is exempt from the rules.
                - paragraph [ref=f140e210]: There is also an equivalent obligation to disclose AI generation or manipulation for text, but only where it is published "with the purpose of informing the public on matters of public interest".
                - complementary [ref=f140e211]:
                  - article [ref=f140e212]:
                    - link [ref=f140e213] [cursor=pointer]:
                      - /url: https://www.dezeen.com/2026/05/28/design-fairs-need-to-adopt-ai-policy-now/
                      - img "Salone del Mobile 2025" [ref=f140e214]
                      - generic [ref=f140e215]:
                        - heading "Read:" [level=1] [ref=f140e216]
                        - heading "\"Design fairs need to adopt an AI policy, and need to do it now\"" [level=2] [ref=f140e217]
                - paragraph [ref=f140e218]: General web copy is therefore unlikely to require labelling, but text related to matters such as sustainability, consumer rights and Environmental, Social and Governance (ESG) strategy will, unless it has been substantially reviewed by a human.
                - paragraph [ref=f140e219]: The disclosure obligations also affect the provision of AI chatbots, such as for the purpose of customer service on a brand homepage, which is covered by Article 50(1).
                - paragraph [ref=f140e220]: Sieniewicz advises that there is no one definitive way to do this, but that the safest choice is to advise that the interaction is with an "AI-powered tool" or an "AI bot" and to make it clear in the first communication with the customer.
                - paragraph [ref=f140e221]: Other subsections in the provisions impose obligations on tech companies making tools such as ChatGPT and Nano Banana to embed machine-readable markers of AI generation into synthetic content, which users are now allowed to remove.
                - paragraph [ref=f140e222]:
                  - strong [ref=f140e223]: Provisions come at time of controversy about AI in architectural visualisation
                - paragraph [ref=f140e224]: Addleshaw Goddard advises that a lighter disclosure regime applies for artistic, creative, satirical or fictional works, but that is unlikely to apply where content is made in part for promotional purposes, such as architectural renderings and advertisements.
                - paragraph [ref=f140e225]: "\"There are some exemptions for artistic works, and that requires less direct transparency, but for the standard businesses in the architecture and design space, and also for product pictures, it will be the case that they need to be labelled as AI-generated,\" said Sieniewicz."
                - paragraph [ref=f140e226]:
                  - text: The implementation of Article 50 is likely to be welcomed by architectural visualisation artists, who have argued that using AI generation in place of professional 3D rendering
                  - link "diminishes their craft and produces error-filled results" [ref=f140e227] [cursor=pointer]:
                    - /url: https://www.genesisstudios.com/2025/08/08/924446-moreland-capital-partners-2/
                  - text: .
                - paragraph [ref=f140e228]:
                  - text: There has also been anger over perceived copyright violations in the training of AI systems, which are fed vast quantities of human-authored work, usually without permission, as well as worries that
                  - link "the use of generative AI tools may render output unprotectable" [ref=f140e229] [cursor=pointer]:
                    - /url: https://www.dezeen.com/2023/08/21/ai-copyright-designers-architects-aitopia/
                  - text: and so able to be copied with impunity by others.
                - paragraph [ref=f140e230]:
                  - emphasis [ref=f140e231]: "Top image: Hotel Attraction by AI artist Thierry Lechanteur."
                - generic [ref=f140e233]:
                  - text: "Read more:"
                  - list [ref=f140e234]:
                    - listitem [ref=f140e235]:
