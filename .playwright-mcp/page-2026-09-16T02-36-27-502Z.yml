                - generic [ref=f538e560]:
                  - generic [ref=f538e561]: "Today, we officially hit 100,000 subscribers on YouTube! 🎉 And honestly, this feels pretty surreal. Growing an education-focused channel to 100K isn’t an easy thing. There are so many entertainment channels out there, and getting people to consistently watch, learn, and come back for more is something I never take for granted. A huge thanks to YOU reading this, for being part of this journey over the years. Whether you’ve been here from the beginning, watched a single tutorial, shared a video with a friend, or regularly follow what I put out, I genuinely appreciate your support. ❤️ This channel actually started with just sharing tutorials on architectural illustration, sketching, Photoshop and a few techniques that I was learning along the way. Over time, it grew into something much bigger. We started exploring AI, architectural technology, software, visualization, workflows, new tools, and even different aspects of the architectural profession. And a big part of what makes this exciting is that I get to learn and experiment alongside you. A lot has changed since the first video, but the intention has remained the same: to share what I learn and hopefully make architecture, visualization and technology a little easier and more accessible to others. 100,000 subscribers is a milestone, but more than the number itself, I’m grateful for the community that has formed around this channel. So, thank you for watching, commenting, sharing, asking questions, and simply being here. 100K! ❤️ Here’s to the next chapter. I have a lot more to learn, experiment with, and share with you.. 🚀"
