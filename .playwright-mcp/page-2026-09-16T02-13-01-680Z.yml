              - generic [ref=f67e173]:
                - paragraph [ref=f67e174]:
                  - text: The world's most prominent architecture studios are embracing
                  - link "AI" [ref=f67e175] [cursor=pointer]:
                    - /url: https://www.dezeen.com/tag/ai/
                  - text: for everything from coming up with designs to project analyses and reports, Dezeen research has found.
                - paragraph [ref=f67e176]:
                  - text: Twenty-six leading architecture studios from around the world told Dezeen about their use of artificial intelligence (AI), including
                  - link "SOM" [ref=f67e177] [cursor=pointer]:
                    - /url: https://www.dezeen.com/tag/skidmore-owings-and-merrill/
                  - text: and
                  - link "Foster + Partners" [ref=f67e178] [cursor=pointer]:
                    - /url: https://www.dezeen.com/tag/foster-partners/
                  - text: . A further 27 declined to comment or did not reply when approached.
                - paragraph [ref=f67e179]: Of the 26 studios that spoke to Dezeen, 25 were not only using AI but actively encouraging it.
                - paragraph [ref=f67e180]:
                  - text: Among them are UK firms
                  - link "ZHA" [ref=f67e181] [cursor=pointer]:
                    - /url: https://www.dezeen.com/tag/zaha-hadid/
                  - text: and
                  - link "Heatherwick Studio" [ref=f67e182] [cursor=pointer]:
                    - /url: https://www.dezeen.com/tag/thomas-heatherwick/
                  - text: ", US studio"
                  - link "HOK" [ref=f67e183] [cursor=pointer]:
                    - /url: https://www.dezeen.com/tag/hok/
                  - text: ", Rotterdam-based"
                  - link "OMA" [ref=f67e184] [cursor=pointer]:
                    - /url: https://www.dezeen.com/tag/oma/
                  - text: ", Indian studio"
                  - link "Morphogenesis" [ref=f67e185] [cursor=pointer]:
                    - /url: https://www.dezeen.com/tag/morphogenesis/
                  - text: ", Norwegian studio"
                  - link "Snøhetta" [ref=f67e186] [cursor=pointer]:
                    - /url: https://www.dezeen.com/tag/snohetta/
                  - text: and Chinese studio
                  - link "MAD" [ref=f67e187] [cursor=pointer]:
                    - /url: https://www.dezeen.com/tag/mad/
                  - text: .
                - paragraph [ref=f67e188]: "\"In the last two years, the computing power and level of sophistication of AI has grown exponentially,\" MAD associate partner Tiffany Dahlen told Dezeen."
                - paragraph [ref=f67e189]: "\"As designers, we need to embrace the technology and use it just like any other software or skill to be developed,\" she continued."
                - paragraph [ref=f67e190]: "\"It's pretty obvious that AI is the major technological change today – just like the shift from hand drafting to CAD to Revit – and we need to learn how to use it to our advantage, otherwise we will be left behind.\""
                - paragraph [ref=f67e191]:
                  - strong [ref=f67e192]: Studios encouraging "responsible" use of AI
                - paragraph [ref=f67e193]: "\"HOK actively encourages responsible AI use in all aspects of the firm, in adherence with two complementary firm-wide policies: an AI Authorized Use policy, which specifies how AI may be used, and an AI Governance policy, which defines the ways in which the firm actively manages our AI-related efforts,\" HOK senior principal Matt Breidenthal told Dezeen."
                - paragraph [ref=f67e194]:
                  - text: Others struck a more cautious tone, such as Danish architecture firm
                  - link "CF Møller" [ref=f67e195] [cursor=pointer]:
                    - /url: https://www.dezeen.com/tag/c-f-moller/
                  - text: .
                - paragraph [ref=f67e196]: "\"We are encouraging them to use it, but thoughtfully,\" said studio partner Rune Bjerno Nielsen."
                - paragraph [ref=f67e197]: "\"Depending on the department or daily role, AI can be less or more beneficial. We try to only use it if it can make an actual impact. Otherwise it gets too expensive, and we also need to look at the environmental impact of data centres.\""
                - paragraph [ref=f67e198]:
                  - text: Barcelona-based
                  - link "Bofill Taller de Arquitectura" [ref=f67e199] [cursor=pointer]:
                    - /url: https://www.dezeen.com/tag/ricardo-bofill/
                  - text: was the only studio we approached that is not actively using AI, but did not explain why and did not respond to follow-up questions.
                - paragraph [ref=f67e200]:
                  - strong [ref=f67e201]: Claude.ai among favourite AI tools
                - paragraph [ref=f67e202]:
                  - text: The
                  - link "RIBA's now-annual AI survey" [ref=f67e203] [cursor=pointer]:
                    - /url: https://www.riba.org/work/insights-and-resources/ai-report/
                  - text: has identified a steady increase in adoption of the technology by UK architecture studios in the past few years – but our research identified which of the world's top studios are using it, and which tools they tend to prefer.
                - paragraph [ref=f67e204]: A clear favourite among the AI tools being adopted is Claude.ai, a large language model (LLM) built by US company Anthropic, which is being used by 44 per cent of the studios we spoke to.
                - paragraph [ref=f67e205]: Other popular tools used by the studios include Google's LLM, Gemini, used by eight of the studios, alongside Microsoft Copilot and ChatGPT, each used by 24 per cent of the studios.
                - paragraph [ref=f67e206]: For image generation, Gemini's Nano Banana proved the most popular, used by seven of 25 the studios. Stable Diffusion and xFigura were also among most-mentioned image generation tools, used by 12 per cent of the studios.
                - complementary [ref=f67e207]:
                  - article [ref=f67e208]:
                    - link [ref=f67e209] [cursor=pointer]:
                      - /url: https://www.dezeen.com/2026/08/10/ai-architectural-renderings-eu-ai-act/
                      - img "Render of Hotel Attaction" [ref=f67e210]
                      - generic [ref=f67e211]:
                        - heading "Read:" [level=1] [ref=f67e212]
                        - heading "Realistic AI architectural renderings must be labelled under EU AI Act" [level=2] [ref=f67e213]
                - paragraph [ref=f67e214]: A key trend emerging alongside the use of these AI tools is the development of in-house AI systems, favoured for their personalisation and data privacy.
                - paragraph [ref=f67e215]:
                  - text: More than half of the studios that told us they are using AI have created in-house systems, including Foster + Partners,
                  - link "Hassell" [ref=f67e216] [cursor=pointer]:
                    - /url: https://www.dezeen.com/tag/hassell/
                  - text: ", Heatherwick Studio,"
                  - link "MVRDV" [ref=f67e217] [cursor=pointer]:
                    - /url: https://www.dezeen.com/tag/mvrdv/
                  - text: ", OMA and"
                  - link "Gensler" [ref=f67e218] [cursor=pointer]:
                    - /url: https://www.dezeen.com/tag/gensler/
                  - text: .
                - paragraph [ref=f67e219]: Notably, despite enthusiastic adoption of AI at many studios, only 19 confirmed that they have established AI policies.
                - paragraph [ref=f67e220]:
                  - text: "\"Yes we do have a policy: we think it's really important to set clear guidelines for responsible use of AI on projects and more widely across our business,\""
                  - link "Hawkins Brown" [ref=f67e221] [cursor=pointer]:
                    - /url: https://www.dezeen.com/tag/hawkinsbrown/
                  - text: COO Alastair Roberts said.
                - paragraph [ref=f67e222]: "\"The guidelines cover professional integrity issues like accuracy and confidentiality and also wider issues like bias and environmental impact,\" he added."
                - paragraph [ref=f67e223]: "\"Ultimately we're stressing that AI produces useful inputs for our work – e.g. it can accelerate or automate some processes very effectively – but we are all still responsible as qualified human professionals for what we deliver to our clients.\""
                - paragraph [ref=f67e224]:
                  - strong [ref=f67e225]: Data privacy a concern for studios using AI
                - paragraph [ref=f67e226]: Other studios with policies in place cited data privacy as a primary concern.
                - paragraph [ref=f67e227]: "\"Our focus is on giving teams clear guidance around both the opportunities and the risks – particularly around data handling – while still allowing room for experimentation,\" ZHA director Nils Fischer and Shajay Bhooshan said."
                - paragraph [ref=f67e228]: "\"We have developed a formal AI Policy designed to safeguard the practice in relation to data, confidentiality and intellectual property,\" Foster + Partners' Martha Tsigkari and Sherif Eltarabishy told Dezeen."
                - paragraph [ref=f67e229]: "\"This allows us to work with AI securely at scale.\""
                - paragraph [ref=f67e230]: At Heatherwick Studio, an AI policy and framework was the second step in its AI strategy, following the creation of an AI working group that assesses the "risks and opportunities" of using AI.
                - paragraph [ref=f67e231]: "\"One of the first steps in our strategy was delivering on a policy, which really focused on ethical use, transparency and integrity, quality assurance, intellectual property, data privacy, and general user concerns around the technology,\" Heatherwick Studio's director of applied research and AI Pablo Zamorano told Dezeen."
                - paragraph [ref=f67e232]: Six studios, including MAD, did not report having an AI policy in place, despite encouraging their architects to use the technology.
                - paragraph [ref=f67e233]: "\"We don't have a formal policy in place yet, but we are encouraging our employees to integrate AI into our daily workflow,\" MAD's Dahlen said."
                - paragraph [ref=f67e234]:
                  - strong [ref=f67e235]: AI used to offload "repetitive processes" and administrative tasks
                - paragraph [ref=f67e236]: Among the studios using AI, outsourcing the repetitive administrative tasks associated with architecture has been a primary aim.
                - paragraph [ref=f67e237]: In doing so, employees have more time to focus on the creative side of things, said OMA managing partner David Gianotten.
                - paragraph [ref=f67e238]: "\"What we see today is a growing portion of architectural practice involves verification – tasks that are increasingly logistical, repetitive, and time-consuming, often drawing energy away from design thinking,\" he said."
                - paragraph [ref=f67e239]: "\"For that reason, we actively encourage our teams to explore AI as a way to reduce these repetitive processes. By offloading administrative and verification tasks, AI allows architects to focus more on observation, critical thinking, and the formulation and development of ideas.\""
                - paragraph [ref=f67e240]: "\"AI is excellent for streamlining workflows and reducing the time our architects and designers spend on non‑creative tasks,\" corroborated Snøhetta's Mørseth."
                - complementary [ref=f67e241]:
                  - article [ref=f67e242]:
                    - link [ref=f67e243] [cursor=pointer]:
                      - /url: https://www.dezeen.com/2026/03/11/architects-highly-expose-ai-anthropic-research/
                      - img "Anthropic exposure study" [ref=f67e244]
                      - generic [ref=f67e245]:
                        - heading "Read:" [level=1] [ref=f67e246]
                        - heading "Architects and engineers among professions most automatable by AI according to Anthropic" [level=2] [ref=f67e247]
                - paragraph [ref=f67e248]: Beyond administrative tasks, studios are also integrating AI into their design workflows, with responses to Dezeen indicating adoption in every project stage, from inception through to delivery.
                - paragraph [ref=f67e249]: "\"We have AI tools that can be deployed across the entire project timeline, from conception to post-occupancy,\" Foster + Partners' Tsigkari and Eltarabishy said."
                - paragraph [ref=f67e250]: Eight studios we spoke to specified using AI for early-stage design development, including HOK.
                - paragraph [ref=f67e251]: According to the studio's senior principal, this process allows for more iterations in the concept phase – enhancing decision-making and creativity.
                - paragraph [ref=f67e252]: "\"We've found that these tools can accelerate decision-making and enhance collaboration for a more agile, creative, and insightful design process,\" said HOK's Breidenthal."
                - paragraph [ref=f67e253]: This is also true for head of digital office at White Arkitekter Peter Leuchovius, who said AI tools have made it easier to test initial ideas in collaboration with clients.
                - paragraph [ref=f67e254]: "\"We've improved customer dialogue by using generative AI in early-stage design – enabling us to faster visualise ideas, test multiple alternatives, and allow the client to participate more actively in the design work,\" said Leuchovius. \"This has made collaboration faster, more informed, and more engaging.\""
                - paragraph [ref=f67e255]:
                  - strong [ref=f67e256]: "\"Making great imagery has never been easier\""
                - paragraph [ref=f67e257]: Image generation was also among the most-popular tasks being supplemented by AI, reported by 16 of the 25 studios encouraging its use.
                - paragraph [ref=f67e258]: Typically outsourced to visualisation studios, architectural renderings are increasingly being realised in-house at a fraction of the time and cost with the help of AI tools.
                - paragraph [ref=f67e259]: This shift, according to principal and head of design at Hassell Xavier De Kestelier, is due to the simplicity of AI interfaces, which he argues allow just about anyone to use them.
                - paragraph [ref=f67e260]: "\"What AI does is democratise the process, empowering team members who may lack specialist technical rendering skills to produce highly sophisticated, high-end visualisations,\" De Kestelier claimed."
                - paragraph [ref=f67e261]: "\"Making great imagery has never been easier,\" Snøhetta's Mørseth added."
                - paragraph [ref=f67e262]: CF Møller estimated that its usage of image editing software Photoshop has fallen 80 per cent as a result of generative AI.
                - paragraph [ref=f67e263]: Other common uses of AI across the leading studios include project research, analysis and reports, data documentation, and modelling.
                - paragraph [ref=f67e264]: "\"We use AI and agent-based workflows to streamline labor-intensive coordination tasks such as documentation automation, data cleanup, computational design workflows, long-form document review, and custom software development,\" chief design technology officer at SOM Shane Burger added."
                - paragraph [ref=f67e265]:
                  - strong [ref=f67e266]: AI not "creative enough" to replace humans
                - paragraph [ref=f67e267]: While these AI tools are rapidly superseding existing systems, the studios highlight human creativity as one thing that cannot yet be replaced by technology.
                - paragraph [ref=f67e268]: "\"We've learned that AI excels at certain tasks, but doesn't pass muster for others,\" said MAD's Dahlen."
                - paragraph [ref=f67e269]: "\"Sometimes it can be clever and find connections that I hadn't thought about, other times it's just repetitive, inaccurate or not creative enough,\" she continued."
                - paragraph [ref=f67e270]:
                  - text: Managing partner at OMA David Gianotten and
                  - link "White Arkitekter" [ref=f67e271] [cursor=pointer]:
                    - /url: https://www.dezeen.com/tag/white-arkitekter/
                  - text: "'s Peter Leuchovius share this sentiment."
                - paragraph [ref=f67e272]: "\"As a creative practice, we believe AI should enhance creative work rather than replace it,\" Gianotten told Dezeen."
                - paragraph [ref=f67e273]: "\"AI will never replace human creativity,\" Leuchovius added. \"But handled right, it will for sure amplify it.\""
                - paragraph [ref=f67e274]:
                  - emphasis [ref=f67e275]: The top image is courtesy of Snøhetta.
