                                    - generic [ref=f76e301]:
                                      - paragraph [ref=f76e302]: It would be interesting to hear the client-side part of this. We recently had a graphic designer present to a client for building graphics, and you could tell that the graphics were done partly with AI. The client had such a visceral negative reaction to AI being used to the point that firing the designer was discussed on the spot with them still standing there. I think firms promoting the use of AI will soon find that their clients do not always react positively.
                                      - paragraph [ref=f76e303]: As we are seeing elsewhere, the general public does not have a favorable view of AI. As a creative professional and as professionals that must be licensed, clients feel like the work is cheapened and they are not getting any true expertise or value for their fee.
                                      - paragraph [ref=f76e304]: AI isn't going away, but I think people worried about losing their jobs shouldn't be. There's also a good Fast Company article about how architectural data is decentralized and proprietary, so it will be very difficult to mass train an AI with drawings and specifications the same way you would with say books, which you can just buy by the 1000s and pay people minimum wage to scan.
