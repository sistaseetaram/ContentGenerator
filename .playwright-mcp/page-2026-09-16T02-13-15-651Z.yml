                                    - generic [ref=f76e211]:
                                      - paragraph [ref=f76e212]: "There's also a lot of bullshit going on about how effective LLMs actually are, as Cory Doctorow explains brilliantly:"
                                      - paragraph [ref=f76e213]:
                                        - link "https://www.thenerve.news/p/cory-doctorow-ai-business-incentive-to-lie-useless-chatbots-report-nikhil-suresh" [ref=f76e214] [cursor=pointer]:
                                          - /url: https://disq.us/url?url=https%3A%2F%2Fwww.thenerve.news%2Fp%2Fcory-doctorow-ai-business-incentive-to-lie-useless-chatbots-report-nikhil-suresh%3Ao268OwTrP4h1cmk-wd73jrc3pbE&cuid=2520325
                                        - text: "Among the key factors driving this alleged sweeping adoption Doctorow highlights:"
                                      - paragraph [ref=f76e215]: 1) bosses generally resent relying on employees, so the lure of AI is having fewer employees in the future2) employees who want to keep their jobs know their bosses want to hear that AI is wonderful and will say it's great, even though they often aren't actually using it
                                      - paragraph [ref=f76e216]:
                                        - text: Ed Zitron
                                        - link "http://wheresyoured.at/" [ref=f76e217] [cursor=pointer]:
                                          - /url: http://disq.us/url?url=http%3A%2F%2Fwheresyoured.at%2F%3Az_yp6AIZlSNYgHQCX8wD5IHmXkc&cuid=2520325
                                        - text: explains how there is no path to positive ROI for the hyperscalers. As frontier models try to charge more for tokens to make a tiny dent in the trillions of capex spent on datacentres and NVIDIA chips and SK Hynix memory companies which were paying a nominal amount in subscriptions are baulking at the price - and in many cases just reverting to how they used to do things, with clever, creative human beings who didn't need to check the output of a LLM at pretty much every stage.
                                      - paragraph [ref=f76e218]: Meanwhile the practices that are listed in this article as actively encouraging the use of AI come as no surprise - you'd have struggled to determine if their work was knocked out by human or computer over the past decade, it's all so generic.
